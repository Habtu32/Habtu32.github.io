/* ---------- Highlighting ---------- */
function hl(code){
  const re=/(#[^\n]*)|("[^"\n]*")|\b(from|import|as|for|in|def|return|True|False|None|lambda)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_]\w*)(?=\()/g;
  let out="",last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    const t=esc(m[0]);
    out+=m[1]?`<span class="c">${t}</span>`:m[2]?`<span class="s">${t}</span>`:m[3]?`<span class="k">${t}</span>`:m[4]?`<span class="n">${t}</span>`:`<span class="f">${t}</span>`;
    last=re.lastIndex;
  }
  return out+esc(code.slice(last));
}

function kmeansOut(){
  return `<div class="widget"><div class="wctl">

function bindKMeans(el){
  const cv=el.querySelector("#km"),ctx=cv.getContext("2d"),slider=el.querySelector("#kslider"),kval=el.querySelector("#kval"),log=el.querySelector("#klog");
  let W=0,H=0,seed=3;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const blobs=[[.2,.25,.07],[.72,.2,.08],[.3,.72,.09],[.78,.7,.07],[.52,.47,.06]];
  const pts=[];blobs.forEach(([x,y,s],bi)=>{const n=[60,50,60,50,40][bi];for(let i=0;i<n;i++)pts.push({x:Math.min(.97,Math.max(.03,x+gauss()*s)),y:Math.min(.95,Math.max(.05,y+gauss()*s)),c:-1})});
  let cents=[],trail=[],token=0;
  const COLS=["--c1","--c2","--c3","--c4","--c5","--c6"];
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);draw()}
  function draw(){
    if(!W)return;ctx.clearRect(0,0,W,H);
    const pad=34,px=x=>pad+x*(W-pad*1.5),py=y=>H-pad-(y*(H-pad*1.6));
    const muted=cssv("--muted"),rule=cssv("--rule"),ink=cssv("--ink"),cols=COLS.map(cssv);
    ctx.strokeStyle=rule;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,8);ctx.lineTo(pad,H-pad);ctx.lineTo(W-8,H-pad);ctx.stroke();
    ctx.fillStyle=muted;ctx.font='12px "JetBrains Mono", monospace';ctx.textAlign="right";ctx.fillText("days since last purchase →",W-10,H-12);
    ctx.save();ctx.translate(14,pad);ctx.rotate(-Math.PI/2);ctx.textAlign="right";ctx.fillText("total spend →",0,0);ctx.restore();
    pts.forEach(p=>{ctx.globalAlpha=p.c<0?.5:.85;ctx.fillStyle=p.c<0?muted:cols[p.c];ctx.beginPath();ctx.arc(px(p.x),py(p.y),3.6,0,Math.PI*2);ctx.fill()});
    ctx.globalAlpha=1;
    trail.forEach((tr,ci)=>{if(tr.length<2)return;ctx.strokeStyle=cols[ci];ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.beginPath();tr.forEach((c,i)=>i?ctx.lineTo(px(c.x),py(c.y)):ctx.moveTo(px(c.x),py(c.y)));ctx.stroke();ctx.setLineDash([])});
    cents.forEach((c,i)=>{const x=px(c.x),y=py(c.y);ctx.fillStyle=cssv("--sheet");ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=cols[i];ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()});
  }
  async function fit(){
    const my=++token;const k=+slider.value;seed=7+k*13+Math.floor(Math.random()*1000);
    pts.forEach(p=>p.c=-1);
    cents=[];const first=pts[Math.floor(rnd()*pts.length)];cents.push({x:first.x,y:first.y});
    while(cents.length<k){const d=pts.map(p=>Math.min(...cents.map(c=>(p.x-c.x)**2+(p.y-c.y)**2)));const sum=d.reduce((a,b)=>a+b,0);let r=rnd()*sum,i=0;while((r-=d[i])>0&&i<d.length-1)i++;cents.push({x:pts[i].x,y:pts[i].y})}
    trail=cents.map(c=>[{...c}]);draw();
    for(let it=1;it<=12;it++){
      if(my!==token)return;
      let inertia=0;pts.forEach(p=>{let b=0,bd=1e9;cents.forEach((c,i)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2;if(d<bd){bd=d;b=i}});p.c=b;inertia+=bd});
      let moved=0;cents=cents.map((c,i)=>{const m=pts.filter(p=>p.c===i);if(!m.length)return c;const n={x:m.reduce((a,p)=>a+p.x,0)/m.length,y:m.reduce((a,p)=>a+p.y,0)/m.length};moved+=Math.hypot(n.x-c.x,n.y-c.y);return n});
      cents.forEach((c,i)=>trail[i].push({...c}));
      log.textContent=`iter ${it} · inertia ${(inertia*1000).toFixed(1)}`;draw();
      if(moved<1e-4){log.textContent+=" · converged";break}
      if(!reduce)await sleep(450);
    }
  }
  slider.addEventListener("input",()=>{kval.textContent=slider.value});
  slider.addEventListener("change",fit);
  el.querySelector("#kfit").addEventListener("click",fit);
  new ResizeObserver(size).observe(cv);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
  themeHooks.push(draw);
  size();setTimeout(fit,reduce?0:300);
}

/* Kernel queue */
const queue=[];let busy=false;
const kernel=$("#kernel"),kstate=$("#kstate");
function setBusy(b){busy=b;kernel.classList.toggle("busy",b);kstate.textContent=b?"Busy":"Idle"}
function enqueue(i,force){const c=CELLS[i];if(!c.code)return;if(c.ran&&!force)return;if(queue.includes(i))return;c.ran=true;c.el.querySelector(".prompt").textContent="In [*]:";queue.push(i);if(!busy)drain()}
async function drain(){
  setBusy(true);
  while(queue.length){
    const i=queue.shift(),c=CELLS[i],el=c.el,pre=el.querySelector("pre"),out=el.querySelector(".output");
    document.querySelectorAll(".cell.running").forEach(x=>x.classList.remove("running"));
    el.classList.add("running");out.innerHTML="";
    if(!reduce){
      const code=c.code;const step=Math.max(1,Math.ceil(code.length/45));
      for(let n=0;n<=code.length;n+=step){pre.innerHTML=hl(code.slice(0,n))+'<span class="caret"></span>';await sleep(14)}
      pre.innerHTML=hl(code);await sleep(220);
    }
    execCount++;
    el.querySelector(".prompt").textContent=`In [${execCount}]:`;
    out.innerHTML=c.out();out.classList.add("reveal");
    if(c.bind)c.bind(out);
    el.classList.remove("running");
  }
  setBusy(false);
}
